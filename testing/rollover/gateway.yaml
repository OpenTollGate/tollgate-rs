# Sells access. Listens; never dials.
identity:
  secret_key: "78d684aa33cd91c862ca9dd42e969b97e511bf36d4848e6a90d967bc174199c1"
mint:
  # Reachable by the client under its compose service name — a peer funds its
  # channel against this, so it has to resolve from the peer's side.
  url: "http://gateway:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://gateway:3338"

access:
  minimum_flow:
    enabled: true
    bytes_per_second: 4096
grants:
  # What the payer sends is free here, so the rates asserted are its
  # downloads alone.
  from_payer_weight: 0
  window_range_ms: [200, 30000]
  # Short windows need purchases closer together than the default second.
  min_topup_gap_ms: 200

channels:
  initial_capacity: 5000000
  # Far below the default floor, which a channel this small has to come down
  # with.
  min_capacity: 1000000
network:
  listen: "0.0.0.0:4747"
