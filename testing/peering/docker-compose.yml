# Do two nodes find each other, fund channels, and reach Active?
services:
  # The money. A sat-denominated mint standing in for the likes of minibits:
  # a node buys its paper here and pays a peer with it, because a peer sells
  # capacity for money it can hold, not for its own vouchers.
  sat-mint:
    # Pinned: mintd's CLI and config format change between releases.
    image: cashubtc/mintd:0.18.1
    # 0.18 keeps its configuration in the database: import the document into a
    # fresh one, then start the mint from it.
    command:
      - sh
      - -c
      - cdk-mintd config init --new-mint --file /etc/cdk/mintd.toml && exec cdk-mintd
    environment:
      MINT_MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    volumes:
      - ../mint/mintd.toml:/etc/cdk/mintd.toml:ro
  gateway:
    image: tollgate-test:latest
    command: ["-c", "/etc/tollgate/gateway.yaml", "--control-socket", "/run/tollgate.sock"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"

  client:
    image: tollgate-test:latest
    command: ["-c", "/etc/tollgate/client.yaml", "--control-socket", "/run/tollgate.sock"]
    volumes:
      - ./client.yaml:/etc/tollgate/client.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"
    depends_on:
      - gateway
      - sat-mint
