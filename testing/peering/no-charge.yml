# Is a payer that does not charge its provider back held past the stale
# timeout, on one connection? The same gateway as docker-compose.yml; the
# client does not charge it, and buys steadily.
services:
  sat-mint:
    # Pinned: mintd's CLI and config format change between releases.
    image: cashubtc/mintd:0.18.1
    command:
      - sh
      - -c
      - cdk-mintd config init --new-mint --file /etc/cdk/mintd.toml && exec cdk-mintd
    environment:
      MINT_MNEMONIC: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
    volumes:
      - ../mint/mintd.toml:/etc/cdk/mintd.toml:ro
  gateway:
    image: tollgate-test:${IMAGE_TAG:-latest}
    command: ["-c", "/etc/tollgate/gateway.yaml"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"

  client:
    image: tollgate-test:${IMAGE_TAG:-latest}
    command: ["-c", "/etc/tollgate/client.yaml", "--demand", "1000000"]
    volumes:
      - ./client-no-charge.yaml:/etc/tollgate/client.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"
    depends_on:
      - gateway
      - sat-mint
