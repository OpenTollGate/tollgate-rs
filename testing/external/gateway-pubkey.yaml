# The same gateway, told its peers prove their keys. Nothing in this topology
# runs FIPS, the only network that proves a key today, so it has to refuse to
# start rather than believe the keys peers announce.
identity:
  secret_key: "78d684aa33cd91c862ca9dd42e969b97e511bf36d4848e6a90d967bc174199c1"
mint:
  url: "http://gateway-pubkey:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://gateway-pubkey:3338"
enforcer:
  kind: external
  identity: pubkey
network:
  listen: "[::]:4747"
