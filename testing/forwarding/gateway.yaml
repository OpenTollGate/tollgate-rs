# Sells transit. Forwards the client's traffic and gates it with nftables.
identity:
  secret_key: "78d684aa33cd91c862ca9dd42e969b97e511bf36d4848e6a90d967bc174199c1"
mint:
  url: "http://gateway:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://gateway:3338"
access:
  # No allowance: a customer that has not paid, or whose grant has lapsed, is
  # dropped rather than carried slowly, so the test can see the gate shut.
  # Its control plane and the mint are this node, which is never gated.
  minimum_flow:
    enabled: false
grants:
  window_range_ms: [200, 30000]
enforcer:
  # The real thing: the kernel forwards, nftables gates, tc shapes.
  kind: ip
  # The interface facing the client. Docker names interfaces in the order it
  # attaches networks, and that order differs between docker versions, so the
  # compose entrypoint finds the one holding 172.28.0.20 and writes its name
  # here before starting the node.
  interface: EDGE_INTERFACE
network:
  listen: "0.0.0.0:4747"
