# Real forwarding: the gateway carries the client's traffic to `origin`, gates
# it with nftables and shapes it with tc.
#
# Two subnets, not one. On a single subnet the origin would reply straight to
# the client and only the outbound half would cross the gateway — the download
# being measured would arrive unshaped, past the thing doing the shaping. With
# the client and the origin on different segments and the gateway on both, every
# packet in both directions has to transit it.
#
#   client ──edge── gateway ──transit── origin
#    .30             .20 .20             .10
services:
  # The money. A sat-denominated mint standing in for the likes of minibits:
  # a node buys its paper here and pays a peer with it, because a peer sells
  # capacity for money it can hold, not for its own vouchers.
  sat-mint:
    image: cashubtc/mintd:latest
    command: ["cdk-mintd", "--config", "/etc/cdk/mintd.toml"]
    volumes:
      - ../mint/mintd.toml:/etc/cdk/mintd.toml:ro
    # On the client's segment: the money is bought by whoever is paying, and
    # here that is the client.
    networks:
      edge:
        ipv4_address: 172.28.0.5
  origin:
    image: python:3-slim
    # Just serves something large enough to measure a rate against. It needs no
    # route back to the client's segment because the gateway masquerades, so
    # every request appears to come from the gateway itself — which is what an
    # upstream normally sees.
    command:
      - /bin/sh
      - -c
      - >
        head -c 200000000 /dev/zero > /srv/blob &&
        cd /srv && exec python3 -m http.server 8080
    networks:
      transit:
        ipv4_address: 172.29.0.10

  gateway:
    image: tollgate-test:latest
    entrypoint: ["/bin/sh", "-c"]
    # Masquerade toward the upstream segment before starting, so the origin
    # replies to the gateway rather than to a client it has no route to. This
    # is the operator's network setup, not the adapter's: a separate table, so
    # tollgated re-creating its own on startup leaves it alone.
    #
    # NAT does not disturb the metering. On the way out the forward hook still
    # sees the client's address, because masquerading happens at postrouting;
    # on the way back conntrack has already restored it by then.
    command:
      - >
        nft add table ip tollgate_nat &&
        nft add chain ip tollgate_nat postrouting
        '{ type nat hook postrouting priority 100; }' &&
        nft add rule ip tollgate_nat postrouting oifname eth1 masquerade &&
        exec tollgated -c /etc/tollgate/gateway.yaml --control-socket /run/tollgate.sock
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"
    # Installing nftables rules and tc classes is privileged, and forwarding has
    # to be switched on explicitly.
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      edge:
        ipv4_address: 172.28.0.20
      transit:
        ipv4_address: 172.29.0.20

  client:
    image: tollgate-test:latest
    entrypoint: ["/bin/sh", "-c"]
    # A sequence with one element, so the whole script reaches `sh -c` as a
    # single argument rather than being split into words.
    command:
      - >
        ip route replace 172.29.0.0/24 via 172.28.0.20 &&
        exec tollgated -c /etc/tollgate/client.yaml
        --control-socket /run/tollgate.sock --demand 2000000
    volumes:
      - ./client.yaml:/etc/tollgate/client.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"
    cap_add: [NET_ADMIN]
    networks:
      edge:
        ipv4_address: 172.28.0.30
    depends_on:
      - gateway
      - origin
      - sat-mint

networks:
  # The gateway shapes on the interface facing the client. Which kernel name
  # that gets is docker's business, so the test asserts it rather than trusting
  # the ordering here.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  transit:
    ipam:
      config:
        - subnet: 172.29.0.0/24
