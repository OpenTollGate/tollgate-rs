# Buys transit and pulls traffic through the gateway.
identity:
  secret_key: "e320cb6477ed200fa997b77fdbbeb76f26f9b4672ac390cccde71292097b2b4b"
mint:
  url: "http://client:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://client:3338"
access:
  minimum_flow:
    enabled: true
    bytes_per_second: 4096
buying:
  # A longer window than the other topologies use, because this one carries a
  # real TCP flow rather than a synthetic one.
  #
  # The lead is what a purchase has to spare: miss it and the budget runs out,
  # the class drops to the allowance with packets in flight, and the transfer
  # spends fifteen seconds in backoff recovering from a gap of a tenth of a
  # second. Buying early costs nothing, since nothing is forfeit.
  window_ms: 4000
  renew_lead_ms: 1200
network:
  listen: "0.0.0.0:4747"
peers:
  "02f383c916faa702f91b5e836ed6f12d5f80fb1752ff4db28e6e77997036befd74":
    # By address: the segment is dual-stack, and the session has to come from
    # the client's IPv4 address, which is what the gateway gates it by.
    endpoint: "172.28.0.20:4747"
