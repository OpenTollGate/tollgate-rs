# Buys transit and pulls traffic through the gateway.
identity:
  secret_key: "e320cb6477ed200fa997b77fdbbeb76f26f9b4672ac390cccde71292097b2b4b"
mint:
  url: "http://client:3338"
  listen: "0.0.0.0:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://client:3338"
access:
  minimum_flow:
    enabled: true
    bytes_per_second: 4096
buying:
  # A longer window than the other topologies use, because this one carries a
  # real TCP flow rather than a synthetic one.
  #
  # The lead is what the renewal has to spare: miss it and the grant lapses, the
  # class drops to the allowance with a whole window of packets in flight, and
  # the transfer spends fifteen seconds in backoff recovering from a gap of a
  # tenth of a second. The forfeit on renewing early is the ratio of the two, so
  # scaling both up buys absolute tolerance at no extra cost — 1.2s of slack
  # here rather than 0.3s, for the same 30% of each grant.
  window_ms: 4000
  renew_lead_ms: 1200
network:
  listen: "0.0.0.0:4747"
peers:
  "02f383c916faa702f91b5e836ed6f12d5f80fb1752ff4db28e6e77997036befd74":
    endpoint: "gateway:4747"
market:
  # What this node takes as payment for its own vouchers, and what a unit of it
  # buys. Priced per issuer: paper from a mint you trust less is worth less.
  accept:
    - mint: "http://sat-mint:8085"
      unit: sat
      bytes_per_unit: 1000000
wallet:
  # Where this node holds the money it pays peers with.
  mint: "http://sat-mint:8085"
  unit: sat
