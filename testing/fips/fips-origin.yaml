# The mesh node the traffic is pulled from.
#
# Also adjacent to the gateway alone. It serves a large file over the mesh and
# has no interest in what anything costs.
node:
  identity:
    nsec: "7a155d96e5659fa94216570b08f58530aa308aa8c967a1cfacd412b83e727278"

tun:
  enabled: true
  name: fips0
  mtu: 1280

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    mtu: 1472

peers:
  - npub: "npub17wpuj9h65up0jx67sdhddufdt7q0k96jlaxm9rnww7vhqd47l46qqp80rr"
    alias: "gateway"
    addresses:
      - transport: udp
        addr: "gateway:2121"
    connect_policy: auto_connect
  # The client, named but never dialled — see the note in fips-client.yaml.
  # The origin learns this identity anyway from the first datagram that
  # arrives, but a reply path that depends on that is a race.
  - npub: "npub1nsxxlerqqwk62uqsc762dqvw4884363dkyn580ln4xc27ffahcqsx83w7y"
    alias: "client"
    addresses:
      - transport: udp
        addr: "client:2121"
    connect_policy: manual
