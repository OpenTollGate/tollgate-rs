# Sells transit, and takes real money for it.
#
# The difference from every other topology here: the mint it is paid in is a
# real one out on the internet, rather than a fake wallet in the next
# container. Nothing settles itself — an invoice is paid by a person with a
# Lightning wallet or it is not paid at all.
#
# Several mints rather than one, because a public mint is somebody else's
# server: minibits refused connections from here, coinos rate-limited the
# quotes. The list below is what was answering.
identity:
  secret_key: "78d684aa33cd91c862ca9dd42e969b97e511bf36d4848e6a90d967bc174199c1"
mint:
  url: "http://gateway:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://gateway:3338"
access:
  minimum_flow:
    enabled: true
    bytes_per_second: 4096
grants:
  # What the client sends is free here: only its downloads draw its budget.
  # 1 would charge an upload the same as a download.
  from_payer_weight: 0
  # The client picks any window in this range. The lower end may not be below
  # min_topup_gap_ms, one second by default.
  window_range_ms: [1000, 30000]

network:
  listen: "0.0.0.0:4747"
