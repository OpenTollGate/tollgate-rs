# Buys transit, paying in real sats.
#
# It holds nothing to begin with, so the first purchase fails until somebody
# tops the wallet up — `tolltop`, wallet tab, `t`, scan the QR. That is the
# whole point of this topology: the money is real, and the step that makes it
# real is a person paying an invoice.
identity:
  secret_key: "e320cb6477ed200fa997b77fdbbeb76f26f9b4672ac390cccde71292097b2b4b"
mint:
  url: "http://client:3338"
  unit: "byte"
vouchers:
  accepted_mints:
    - "http://client:3338"
access:
  minimum_flow:
    enabled: true
    bytes_per_second: 4096

buying:
  # Small on purpose. At the gateway's price a 1 GB channel is about 56 sat,
  # and this rate draws one down in roughly ten minutes.
  demand: 1000000
  headroom_pct: 100
  window_ms: 4000
  renew_lead_ms: 1200

network:
  listen: "0.0.0.0:4747"
peers:
  "02f383c916faa702f91b5e836ed6f12d5f80fb1752ff4db28e6e77997036befd74":
    endpoint: "gateway:4747"
