# Is an oversized purchase refused and re-bought at the rate named?
services:
  gateway:
    image: tollgate-test:latest
    command: ["-c", "/etc/tollgate/gateway.yaml", "--control-socket", "/run/tollgate.sock"]
    volumes:
      - ./gateway.yaml:/etc/tollgate/gateway.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"

  client:
    image: tollgate-test:latest
    command: ["-c", "/etc/tollgate/client.yaml", "--control-socket", "/run/tollgate.sock", "--demand", "8000000"]
    volumes:
      - ./client.yaml:/etc/tollgate/client.yaml:ro
    environment:
      RUST_LOG: "${RUST_LOG:-tollgate_net=debug,info}"
    depends_on:
      - gateway
