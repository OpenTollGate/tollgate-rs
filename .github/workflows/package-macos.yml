name: macOS Package

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      packaging: ${{ steps.guard.outputs.present }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gated on the packaging tree being present on this ref — see the note in
      # package-openwrt.yml for why the workflow can be somewhere the scripts
      # are not, and why this is a step rather than a job-level `hashFiles`.
      - name: Is the packaging tree on this ref?
        id: guard
        run: |
          if [ -f packaging/macos/build-pkg.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packaging/ is not on this ref; nothing to build"
          fi

      - name: Derive a package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # `pkgbuild --version` wants something it can order, so the branch
          # form is numeric after the name: height and short hash.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "package_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g')
            echo "package_version=${BRANCH}.$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" \
              >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build .pkg (${{ matrix.arch }})
    runs-on: macos-latest
    needs: [version]
    if: needs.version.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      # cdk's signatory reaches gRPC through prost, whose build script shells
      # out to protoc.
      - name: Install protoc
        run: brew install protobuf

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin tollgated --bin tolltop

      - name: Build the package
        run: |
          packaging/macos/build-pkg.sh \
            --version "${{ needs.version.outputs.package_version }}" \
            --target ${{ matrix.target }} \
            --no-build

      # The package is named from the build target rather than the build host,
      # so each leg produces a distinctly named, arch-correct asset. Assert it:
      # a regression in that naming would otherwise show up as one arch quietly
      # overwriting the other when the release job merges them.
      - name: Verify the package
        shell: bash
        run: |
          set -euo pipefail
          PKG="deploy/tollgate-${{ needs.version.outputs.package_version }}-macos-${{ matrix.arch }}.pkg"
          [ -f "$PKG" ] || { echo "FAIL: $PKG was not produced"; ls -la deploy; exit 1; }
          echo "==> $PKG"

          pkgutil --expand "$PKG" "$(mktemp -d)/expanded"

          FILES=$(pkgutil --payload-files "$PKG")
          for f in ./usr/local/bin/tollgated ./usr/local/bin/tolltop \
                   ./Library/LaunchDaemons/com.tollgate.daemon.plist \
                   ./usr/local/etc/tollgate/tollgate.yaml.default; do
            echo "$FILES" | grep -qx "$f" || { echo "FAIL: missing $f"; exit 1; }
          done

          # The config is installed as `.default` and copied into place by the
          # postinstall only when nothing is there. Shipping the real path would
          # overwrite an installed node's identity and wallet on upgrade.
          if echo "$FILES" | grep -qx "./usr/local/etc/tollgate/tollgate.yaml"; then
            echo "FAIL: the package would overwrite an existing config"
            exit 1
          fi

          # And the wallet's directory ships empty, for the same reason.
          if echo "$FILES" | grep -q "wallet.sqlite"; then
            echo "FAIL: the package carries a wallet"
            exit 1
          fi

          echo "PASS"
          ls -lh "$PKG"

      - name: Checksum
        run: |
          cd deploy
          for f in *.pkg; do shasum -a 256 "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v7
        with:
          name: tollgate-pkg-${{ matrix.arch }}
          path: |
            deploy/*.pkg
            deploy/*.sha256
          retention-days: 14

  release:
    name: Publish to the GitHub release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach the packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.pkg
            dist/*.sha256
