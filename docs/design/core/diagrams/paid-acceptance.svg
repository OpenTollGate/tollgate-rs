<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 14px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    text.comp     { font-size: 13px; font-weight: bold; }

    .bg      { fill: #0d1117; }
    .callout { fill: #151520; }
    .node    { fill: #2e3a5e; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.annot { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node         { fill: #ddf4ff; }
    }
  </style>

  <defs>
    <marker id="paArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#909090"/>
    </marker>
  </defs>

  <rect width="800" height="380" rx="8" class="bg"/>

  <text x="400" y="28" text-anchor="middle" class="title">Paid Acceptance</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">For the case where a peer has no use for your vouchers &#8212; a leaf's upload</text>

  <rect x="50" y="110" width="160" height="100" rx="8" class="node" stroke="#5080c0" stroke-width="2"/>
  <text x="130" y="142" text-anchor="middle" class="nlabel">Leaf A</text>
  <text x="130" y="162" text-anchor="middle" class="nrole">uploads through B</text>
  <text x="130" y="178" text-anchor="middle" class="nrole">issues A-vouchers</text>

  <rect x="590" y="110" width="160" height="100" rx="8" class="node" stroke="#40a060" stroke-width="2"/>
  <text x="670" y="142" text-anchor="middle" class="nlabel">Relay B</text>
  <text x="670" y="162" text-anchor="middle" class="nrole">gains nothing from</text>
  <text x="670" y="178" text-anchor="middle" class="nrole">A's upload &#8212; quotes m/n</text>

  <rect x="278" y="92" width="244" height="136" rx="6" class="callout" stroke="#d0a040" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="110" text-anchor="middle" class="annot" fill="#d0a040">one payment, two parts</text>

  <rect x="300" y="120" width="200" height="44" rx="4" fill="#2e3a5e" stroke="#5080c0" stroke-width="1.5"/>
  <text x="400" y="139" text-anchor="middle" class="comp" fill="#5080c0">A-voucher worth n</text>
  <text x="400" y="155" text-anchor="middle" class="annot">what A wants B to hold</text>

  <rect x="300" y="172" width="200" height="44" rx="4" fill="none" stroke="#d0a040" stroke-width="1.5"/>
  <text x="400" y="191" text-anchor="middle" class="comp" fill="#d0a040">B-voucher worth m</text>
  <text x="400" y="207" text-anchor="middle" class="annot">what A pays to get it held</text>

  <line x1="215" y1="160" x2="272" y2="160" stroke="#909090" stroke-width="1.5" marker-end="url(#paArr)"/>
  <line x1="528" y1="160" x2="585" y2="160" stroke="#909090" stroke-width="1.5" marker-end="url(#paArr)"/>

  <text x="400" y="250" text-anchor="middle" class="annot" fill="#d0a040">voucher price = &#8722;m/n, quoted by B, renegotiated each metering interval</text>

  <rect x="80" y="268" width="640" height="52" rx="4" class="callout" stroke="#d0a040" stroke-width="1"/>
  <text x="400" y="288" text-anchor="middle" class="annot" fill="#d0a040">The negative price lives entirely here.</text>
  <text x="400" y="306" text-anchor="middle" class="annot">B now has A-vouchers to pay A with, so both directions run at positive prices.</text>

  <text x="400" y="348" text-anchor="middle" class="caption">Normal operation needs none of this &#8212; you simply pay in the vouchers of whoever is delivering.</text>
  <text x="400" y="365" text-anchor="middle" class="caption">The payment protocol never sees a negative number.</text>
</svg>
