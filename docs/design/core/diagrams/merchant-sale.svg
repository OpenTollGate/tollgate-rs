<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 13px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.plabel   { font-size: 13px; font-weight: bold; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.alabel   { font-size: 11px; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    line.sep      { stroke: #303040; stroke-width: 1; stroke-dasharray: 6,4; }
    line.life     { stroke: #303040; stroke-width: 1; stroke-dasharray: 2,3; }

    .bg           { fill: #0d1117; }
    .callout      { fill: #151520; }
    .node         { fill: #2e3a5e; stroke: #5080c0; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.plabel, text.annot, text.altlabel,
      text.elabel, text.mdesc, text.tlabel { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      line.sep, line.life { stroke: #d1d9e0; }
      rect.alt      { stroke: #d1d9e0; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node, rect.node { fill: #ddf4ff; stroke: #0969da; }
      rect.compute, rect.result { fill: #f6f8fa; }
    }
  </style>

  <defs>
    <marker id="msB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#5080c0"/>
    </marker>
    <marker id="msY" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#d0a040"/>
    </marker>
    <marker id="msG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#40a060"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="470" rx="8" class="bg"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" class="title">A Sale, End to End</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">merchantd takes payment, then mints with the buyer's blinded outputs</text>

  <!-- Node headers -->
  <rect x="80" y="65" width="120" height="42" class="node" stroke-width="2" rx="6"/>
  <text x="140" y="85" text-anchor="middle" class="nlabel">buyer</text>
  <text x="140" y="98" text-anchor="middle" class="nrole">any Cashu wallet</text>

  <rect x="320" y="65" width="120" height="42" class="node" stroke="#d0a040" stroke-width="2" rx="6"/>
  <text x="380" y="85" text-anchor="middle" class="nlabel">merchantd</text>
  <text x="380" y="98" text-anchor="middle" class="nrole">holds the payment</text>

  <rect x="560" y="65" width="120" height="42" class="node" stroke="#40a060" stroke-width="2" rx="6"/>
  <text x="620" y="85" text-anchor="middle" class="nlabel">mintd</text>
  <text x="620" y="98" text-anchor="middle" class="nrole">private listener</text>

  <!-- Lifelines -->
  <line x1="140" y1="107" x2="140" y2="425" class="life"/>
  <line x1="380" y1="107" x2="380" y2="425" class="life"/>
  <line x1="620" y1="107" x2="620" y2="425" class="life"/>

  <!-- Phase 1: Pay -->
  <text x="40" y="138" text-anchor="middle" class="plabel">1</text>
  <text x="40" y="154" text-anchor="middle" class="annot">Pay</text>

  <line x1="150" y1="145" x2="368" y2="145" stroke="#5080c0" stroke-width="1.5" marker-end="url(#msB)"/>
  <text x="258" y="130" text-anchor="middle" class="alabel" fill="#5080c0">POST /tollgate/market/v1/swap</text>
  <text x="258" y="160" text-anchor="middle" class="annot">payment token + blinded outputs</text>

  <text x="390" y="185" class="annot">price the sale (rate only if units differ)</text>
  <text x="390" y="201" class="annot">deposit the payment: swap it at its own mint</text>

  <line x1="70" y1="220" x2="700" y2="220" class="sep"/>

  <!-- Phase 2: Quote -->
  <text x="40" y="244" text-anchor="middle" class="plabel">2</text>
  <text x="40" y="260" text-anchor="middle" class="annot">Quote</text>

  <line x1="390" y1="245" x2="608" y2="245" stroke="#d0a040" stroke-width="1.5" marker-end="url(#msY)"/>
  <text x="500" y="238" text-anchor="middle" class="alabel" fill="#d0a040">NUT-04 mint quote, amount n</text>

  <line x1="610" y1="275" x2="392" y2="275" stroke="#40a060" stroke-width="1.5" marker-end="url(#msG)"/>
  <text x="500" y="268" text-anchor="middle" class="alabel" fill="#40a060">quote: PAID on creation</text>

  <line x1="70" y1="295" x2="700" y2="295" class="sep"/>

  <!-- Phase 3: Mint -->
  <text x="40" y="319" text-anchor="middle" class="plabel">3</text>
  <text x="40" y="335" text-anchor="middle" class="annot">Mint</text>

  <line x1="390" y1="320" x2="608" y2="320" stroke="#d0a040" stroke-width="1.5" marker-end="url(#msY)"/>
  <text x="500" y="313" text-anchor="middle" class="alabel" fill="#d0a040">NUT-04 mint(quote, outputs)</text>

  <line x1="610" y1="350" x2="392" y2="350" stroke="#40a060" stroke-width="1.5" marker-end="url(#msG)"/>
  <text x="500" y="343" text-anchor="middle" class="alabel" fill="#40a060">blind signatures</text>

  <line x1="70" y1="370" x2="700" y2="370" class="sep"/>

  <!-- Phase 4: Deliver -->
  <text x="40" y="394" text-anchor="middle" class="plabel">4</text>
  <text x="40" y="410" text-anchor="middle" class="annot">Return</text>

  <line x1="370" y1="398" x2="152" y2="398" stroke="#40a060" stroke-width="1.5" marker-end="url(#msG)"/>
  <text x="258" y="391" text-anchor="middle" class="alabel" fill="#40a060">blind signatures</text>
  <text x="258" y="414" text-anchor="middle" class="annot">buyer unblinds: vouchers merchantd never saw</text>

  <!-- Caption -->
  <text x="380" y="455" text-anchor="middle" class="caption">A failure after step 1 leaves a paid quote to mint against — not a payment with nothing issued</text>
</svg>
