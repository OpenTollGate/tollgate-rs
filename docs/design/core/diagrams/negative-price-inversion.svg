<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 13px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    text.rule     { font-size: 12px; font-weight: bold; }

    .bg      { fill: #0d1117; }
    .callout { fill: #151520; }
    .node    { fill: #2e3a5e; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.annot { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node         { fill: #ddf4ff; }
    }
  </style>

  <defs>
    <marker id="niByte" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#5080c0"/>
    </marker>
    <marker id="niPay" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#d0a040"/>
    </marker>
  </defs>

  <rect width="800" height="410" rx="8" class="bg"/>

  <text x="400" y="28" text-anchor="middle" class="title">Where the Negative Price Comes From</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">Most negative pricing is a sign correction, not an economic mechanism</text>

  <rect x="40" y="66" width="720" height="148" rx="8" class="callout" stroke="#c05050" stroke-width="1.5"/>
  <text x="60" y="88" class="rule" fill="#c05050">Rule: the deliverer charges</text>

  <rect x="120" y="102" width="130" height="66" rx="8" class="node" stroke="#5080c0" stroke-width="2"/>
  <text x="185" y="130" text-anchor="middle" class="nlabel">Leaf A</text>
  <text x="185" y="148" text-anchor="middle" class="nrole">sends uplink</text>

  <rect x="550" y="102" width="130" height="66" rx="8" class="node" stroke="#40a060" stroke-width="2"/>
  <text x="615" y="130" text-anchor="middle" class="nlabel">Relay B</text>
  <text x="615" y="148" text-anchor="middle" class="nrole">forwards it on</text>

  <text x="400" y="115" text-anchor="middle" class="annot" fill="#5080c0">A "delivers" its own uplink bytes to B</text>
  <line x1="255" y1="124" x2="545" y2="124" stroke="#5080c0" stroke-width="2" marker-end="url(#niByte)"/>

  <text x="400" y="146" text-anchor="middle" class="annot" fill="#d0a040">so the rule bills B for A's traffic</text>
  <line x1="545" y1="155" x2="258" y2="155" stroke="#d0a040" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#niPay)"/>

  <text x="400" y="198" text-anchor="middle" class="rule" fill="#c05050">a negative price exists only to cancel this out</text>

  <rect x="40" y="230" width="720" height="140" rx="8" class="callout" stroke="#40a060" stroke-width="1.5"/>
  <text x="60" y="252" class="rule" fill="#40a060">Rule: the beneficiary pays</text>

  <rect x="120" y="264" width="130" height="66" rx="8" class="node" stroke="#5080c0" stroke-width="2"/>
  <text x="185" y="292" text-anchor="middle" class="nlabel">Leaf A</text>
  <text x="185" y="310" text-anchor="middle" class="nrole">beneficiary</text>

  <rect x="550" y="264" width="130" height="66" rx="8" class="node" stroke="#40a060" stroke-width="2"/>
  <text x="615" y="292" text-anchor="middle" class="nlabel">Relay B</text>
  <text x="615" y="310" text-anchor="middle" class="nrole">provides transit</text>

  <text x="400" y="277" text-anchor="middle" class="annot" fill="#5080c0">A's traffic, counted in both directions</text>
  <line x1="255" y1="286" x2="545" y2="286" stroke="#5080c0" stroke-width="2" marker-end="url(#niByte)"/>
  <line x1="545" y1="296" x2="255" y2="296" stroke="#5080c0" stroke-width="2" marker-end="url(#niByte)"/>

  <text x="400" y="318" text-anchor="middle" class="annot" fill="#d0a040">A pays for all of it &#8212; no sign flip</text>
  <line x1="255" y1="326" x2="545" y2="326" stroke="#d0a040" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#niPay)"/>

  <text x="400" y="356" text-anchor="middle" class="rule" fill="#40a060">offload was never negative &#8212; it was a purchase</text>

  <text x="400" y="392" text-anchor="middle" class="caption">The one genuinely negative case that remains is attracting resources, settled in bilaterally-priced vouchers.</text>
</svg>
