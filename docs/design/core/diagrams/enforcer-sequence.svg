<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 13px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.plabel   { font-size: 13px; font-weight: bold; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.alabel   { font-size: 11px; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    line.sep      { stroke: #303040; stroke-width: 1; stroke-dasharray: 6,4; }
    line.life     { stroke: #303040; stroke-width: 1; stroke-dasharray: 2,3; }

    .bg           { fill: #0d1117; }
    .callout      { fill: #151520; }
    .node         { fill: #2e3a5e; stroke: #5080c0; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.plabel, text.annot, text.altlabel,
      text.elabel, text.mdesc, text.tlabel { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      line.sep, line.life { stroke: #d1d9e0; }
      rect.alt      { stroke: #d1d9e0; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node, rect.node { fill: #ddf4ff; stroke: #0969da; }
      rect.compute, rect.result { fill: #f6f8fa; }
    }
  </style>

  <defs>
    <marker id="gsB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#5080c0"/>
    </marker>
    <marker id="gsY" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#d0a040"/>
    </marker>
    <marker id="gsG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#40a060"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="560" rx="8" class="bg"/>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" class="title">Enforcer Protocol</text>
  <text x="380" y="46" text-anchor="middle" class="subtitle">tollgated decides what is owed; the enforcer opens, shapes and counts</text>

  <!-- Node headers -->
  <rect x="130" y="65" width="180" height="42" class="node" stroke="#40a060" stroke-width="2" rx="6"/>
  <text x="220" y="85" text-anchor="middle" class="nlabel">enforcer</text>
  <text x="220" y="98" text-anchor="middle" class="nrole">server; owns the traffic</text>

  <rect x="450" y="65" width="180" height="42" class="node" stroke-width="2" rx="6"/>
  <text x="540" y="85" text-anchor="middle" class="nlabel">tollgated</text>
  <text x="540" y="98" text-anchor="middle" class="nrole">connects, reconnects</text>

  <!-- Lifelines -->
  <line x1="220" y1="107" x2="220" y2="515" class="life"/>
  <line x1="540" y1="107" x2="540" y2="515" class="life"/>

  <!-- Phase 1: Connect -->
  <text x="40" y="138" text-anchor="middle" class="plabel">1</text>
  <text x="40" y="154" text-anchor="middle" class="annot">Connect</text>
  <text x="230" y="128" class="annot">listening; everyone closed</text>

  <line x1="530" y1="150" x2="232" y2="150" stroke="#5080c0" stroke-width="1.5" marker-end="url(#gsB)"/>
  <text x="380" y="143" text-anchor="middle" class="alabel" fill="#5080c0">connect</text>

  <line x1="230" y1="180" x2="528" y2="180" stroke="#40a060" stroke-width="1.5" marker-end="url(#gsG)"/>
  <text x="380" y="173" text-anchor="middle" class="alabel" fill="#40a060">hello(1, identify, delegated)</text>
  <text x="550" y="197" class="annot">check against own Identify</text>
  <text x="550" y="211" class="annot">mismatch: startup error</text>

  <line x1="70" y1="228" x2="700" y2="228" class="sep"/>

  <!-- Phase 2: Full state -->
  <text x="40" y="252" text-anchor="middle" class="plabel">2</text>
  <text x="40" y="268" text-anchor="middle" class="annot">Full state</text>

  <line x1="530" y1="258" x2="232" y2="258" stroke="#5080c0" stroke-width="1.5" marker-end="url(#gsB)"/>
  <text x="380" y="251" text-anchor="middle" class="alabel" fill="#5080c0">bind + set, every payer</text>
  <text x="380" y="274" text-anchor="middle" class="annot">the whole of what the enforcer knows</text>

  <line x1="70" y1="290" x2="700" y2="290" class="sep"/>

  <!-- Phase 3: Live -->
  <text x="40" y="314" text-anchor="middle" class="plabel">3</text>
  <text x="40" y="330" text-anchor="middle" class="annot">Live</text>

  <line x1="530" y1="320" x2="232" y2="320" stroke="#5080c0" stroke-width="1.5" marker-end="url(#gsB)"/>
  <text x="380" y="313" text-anchor="middle" class="alabel" fill="#5080c0">bind(peer, subjects)</text>
  <text x="550" y="324" class="annot">a payer connects</text>

  <line x1="230" y1="355" x2="528" y2="355" stroke="#d0a040" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#gsY)"/>
  <text x="380" y="348" text-anchor="middle" class="alabel" fill="#d0a040">conflict(peer, subject)</text>
  <text x="550" y="359" class="annot">only if refused</text>

  <line x1="530" y1="390" x2="232" y2="390" stroke="#5080c0" stroke-width="1.5" marker-end="url(#gsB)"/>
  <text x="380" y="383" text-anchor="middle" class="alabel" fill="#5080c0">set(peer, rate)</text>
  <text x="550" y="394" class="annot">core changed its rate</text>
  <text x="380" y="406" text-anchor="middle" class="annot">0 closed · n bytes/s shaped · null unshaped</text>

  <line x1="230" y1="440" x2="528" y2="440" stroke="#40a060" stroke-width="1.5" marker-end="url(#gsG)"/>
  <text x="380" y="433" text-anchor="middle" class="alabel" fill="#40a060">counters(peer, delivered, received)</text>
  <text x="550" y="444" class="annot">every tick</text>

  <line x1="530" y1="480" x2="232" y2="480" stroke="#5080c0" stroke-width="1.5" marker-end="url(#gsB)"/>
  <text x="380" y="473" text-anchor="middle" class="alabel" fill="#5080c0">remove(peer)</text>
  <text x="550" y="484" class="annot">payer gone</text>

  <!-- Caption -->
  <text x="380" y="542" text-anchor="middle" class="caption">The socket drops: the enforcer forgets everything and is closed again</text>
</svg>
