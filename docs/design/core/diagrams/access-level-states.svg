<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.slabel   { font-size: 14px; font-weight: bold; }
    text.sdesc    { font-size: 10px; }
    text.elabel   { font-size: 9px; fill: #b0b0b0; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }

    .bg           { fill: #0d1117; }
    .callout      { fill: #151520; }
    .node         { fill: #2e3a5e; stroke: #5080c0; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.plabel, text.annot, text.altlabel,
      text.elabel, text.mdesc, text.tlabel, text.sdesc { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      line.sep, line.life { stroke: #d1d9e0; }
      rect.alt      { stroke: #d1d9e0; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node, rect.node { fill: #ddf4ff; stroke: #0969da; }
      rect.compute, rect.result { fill: #f6f8fa; }
    }
  </style>

  <defs>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#50c050"/>
    </marker>
    <marker id="ared" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#c05050"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="370" rx="8" class="bg"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">Access Level State Machine</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">Per-peer payment status determines delivery access</text>

  <!-- ═══ NONE — center top ═══ -->
  <rect x="270" y="75" width="180" height="55" rx="8" class="callout" stroke="#c05050" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" class="slabel" fill="#f08080">None</text>
  <text x="360" y="118" text-anchor="middle" class="sdesc" fill="#909090">allowance only</text>

  <!-- ═══ ACTIVE — center middle ═══ -->
  <rect x="120" y="225" width="180" height="55" rx="8" class="callout" stroke="#50c050" stroke-width="2"/>
  <text x="210" y="250" text-anchor="middle" class="slabel" fill="#80e080">Active</text>
  <text x="210" y="268" text-anchor="middle" class="sdesc" fill="#909090">metered, visible</text>

  <!-- ═══ FREE — right middle ═══ -->
  <rect x="420" y="225" width="180" height="55" rx="8" class="callout" stroke="#50c050" stroke-width="2"/>
  <text x="510" y="250" text-anchor="middle" class="slabel" fill="#80e080">Free</text>
  <text x="510" y="268" text-anchor="middle" class="sdesc" fill="#909090">unmetered, visible</text>

  <!-- ═══ TRANSITIONS ═══ -->

  <!-- None → Active (down-left) -->
  <line x1="320" y1="130" x2="240" y2="223" stroke="#50c050" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="222" y="170" text-anchor="end" class="elabel">payment ok</text>
  <text x="222" y="182" text-anchor="end" class="elabel">(channel funded)</text>

  <!-- None → Free (down-right) -->
  <line x1="400" y1="130" x2="480" y2="223" stroke="#50c050" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#ag)"/>
  <text x="500" y="178" text-anchor="start" class="elabel">not charged</text>

  <!-- Active → None (up, the session ends) -->
  <line x1="270" y1="225" x2="340" y2="133" stroke="#c05050" stroke-width="1.5" marker-end="url(#ared)"/>
  <text x="318" y="196" text-anchor="start" class="elabel">payment lapsed</text>
  <text x="318" y="208" text-anchor="start" class="elabel">(last channel full,</text>
  <text x="318" y="220" text-anchor="start" class="elabel">its grant run out)</text>

  <!-- ═══ Legend ═══ -->
  <line x1="180" y1="320" x2="210" y2="320" stroke="#c05050" stroke-width="2"/>
  <text x="218" y="324" class="elabel">no session (allowance only)</text>

  <line x1="400" y1="320" x2="430" y2="320" stroke="#50c050" stroke-width="2"/>
  <text x="438" y="324" class="elabel">TollGate session</text>

  <text x="360" y="352" text-anchor="middle" class="caption">Any state → None on disconnect</text>
</svg>
