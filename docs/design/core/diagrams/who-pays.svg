<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 14px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    text.amt      { font-size: 12px; font-weight: bold; }

    .bg      { fill: #0d1117; }
    .callout { fill: #151520; }
    .node    { fill: #2e3a5e; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.annot { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node         { fill: #ddf4ff; }
    }
  </style>

  <defs>
    <marker id="wpDown" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#40a060"/>
    </marker>
    <marker id="wpUp" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#d0a040"/>
    </marker>
  </defs>

  <rect width="800" height="400" rx="8" class="bg"/>

  <text x="400" y="28" text-anchor="middle" class="title">Who Pays For What</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">One sale, one channel &#8212; directions named by the roles in the sale</text>

  <rect x="45" y="70" width="165" height="100" rx="8" class="node" stroke="#5080c0" stroke-width="2"/>
  <text x="127" y="100" text-anchor="middle" class="nlabel">Phone A</text>
  <text x="127" y="122" text-anchor="middle" class="nrole">payer: buys from B</text>
  <text x="127" y="140" text-anchor="middle" class="nrole">funds channel A&#8594;B</text>
  <text x="127" y="158" text-anchor="middle" class="nrole">needs no mint</text>

  <rect x="590" y="70" width="165" height="100" rx="8" class="node" stroke="#40a060" stroke-width="2"/>
  <text x="672" y="100" text-anchor="middle" class="nlabel">Relay B</text>
  <text x="672" y="122" text-anchor="middle" class="nrole">provider: sells to A</text>
  <text x="672" y="140" text-anchor="middle" class="nrole">100/10 line</text>
  <text x="672" y="158" text-anchor="middle" class="nrole">from_payer_weight = 10</text>

  <text x="400" y="88" text-anchor="middle" class="annot" fill="#40a060">units_to_payer: 1,000 MB to A</text>
  <line x1="585" y1="100" x2="215" y2="100" stroke="#40a060" stroke-width="2.5" marker-end="url(#wpDown)"/>

  <text x="400" y="128" text-anchor="middle" class="annot" fill="#d0a040">units_from_payer: 50 MB from A</text>
  <line x1="215" y1="140" x2="585" y2="140" stroke="#d0a040" stroke-width="1.5" marker-end="url(#wpUp)"/>

  <rect x="70" y="185" width="660" height="56" rx="4" class="callout" stroke="#d0a040" stroke-width="1"/>
  <text x="400" y="206" text-anchor="middle" class="amt">moved = units_to_payer + units_from_payer &#215; from_payer_weight</text>
  <text x="400" y="228" text-anchor="middle" class="amt" fill="#d0a040">A&#8217;s budget is drawn 1,000 + 50 &#215; 10 = 1,500 &#183; B buys nothing back</text>

  <rect x="70" y="254" width="660" height="62" rx="4" class="callout" stroke="#5080c0" stroke-width="1"/>
  <text x="400" y="274" text-anchor="middle" class="annot" fill="#5080c0">Peering: two sales, A and B each the payer in one, both weights 0</text>
  <text x="400" y="292" text-anchor="middle" class="annot">A&#8217;s budget with B is drawn by what flows to A; B&#8217;s with A by what flows to B</text>
  <text x="400" y="308" text-anchor="middle" class="annot">two channels, one for each sale</text>

  <text x="400" y="344" text-anchor="middle" class="caption">from_payer_weight is set by the provider in its Offer: unsigned, default 1.</text>
  <text x="400" y="362" text-anchor="middle" class="caption">0 = free &#183; 1 = both directions the same &#183; 10 = a unit from the payer ten times dearer</text>
  <text x="400" y="380" text-anchor="middle" class="caption">It cannot go below 0, so no customer is ever paid for sending.</text>
</svg>
