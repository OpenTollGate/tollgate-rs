[package]
name = "tollgate-net"
description = "TollGate node: raw-TCP transport, payment channels, and a network-forwarding resource adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tollgated"
path = "src/bin/tollgated.rs"

[[bin]]
name = "tolltop"
path = "src/bin/tolltop.rs"

[dependencies]
tollgate-core.workspace = true
tollgate-protocol.workspace = true

tokio.workspace = true
secp256k1.workspace = true
sha2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
hex.workspace = true
# The control socket publishes a snapshot per tick and readers take whatever is
# current, so the swap wants to be cheap and lock-free rather than contended.
arc-swap = "1"
ratatui = "0.30"
crossterm = "0.29"
# FIPS names peers by npub, so the adapter that drives it has to speak NIP-19.
bech32 = "0.11"
# Implementing cdk's payment-processor trait, and rewriting the stream of
# payments it produces. Both versions follow cdk's own.
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await"] }

# --- Cashu: the mint this node runs, and the channels it pays over ---------
# Pinned to the same cdk tag the reference workspace uses; two different cdk
# versions in one graph would not resolve.
#
# cdk-spilman comes from our fork rather than upstream, because upstream cannot
# round-trip a custom currency unit and a byte-denominated keyset is exactly
# that. Fix submitted as SatsAndSports/cashu_spilman_channels#2; switch the
# `git` URL back to upstream once it lands.
#
# A git dependency rather than a path into `reference/`: that directory holds
# reading copies of other projects and is not checked in, so depending on it
# would break a fresh clone and the container build.
cdk-spilman = { git = "https://github.com/Origami74/cashu_spilman_channels.git", branch = "fix/custom-currency-units", package = "cdk-spilman", features = ["wallet", "configurable-host-reqwest"] }
cdk = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cdk", default-features = false, features = ["mint"] }
cdk-axum = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cdk-axum", default-features = false }
cdk-common = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cdk-common", default-features = false }
cdk-fake-wallet = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cdk-fake-wallet" }
cdk-sqlite = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cdk-sqlite", default-features = false, features = ["mint"] }
cashu = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.16.0", package = "cashu", default-features = false }
axum = { version = "0.8" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = { version = "1" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
