name: Rust test

# Nostr CI (ngit-ci) workflow. See .ngit/README.md for the authorization
# policy, how to read results, and the checks deliberately not run here.
#
# This mirrors the `check`, `no_std` and integration jobs of
# .github/workflows/ci.yml, which is left untouched: the same pinned toolchain
# (rust-toolchain.toml pins 1.94.1), the same protoc install and commands in the
# same order, run from the workspace root.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      # Cache only; the coordinator can run with caching disabled, so a cache
      # failure must not fail the job.
      - name: Restore Rust build cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      # cdk's signatory reaches gRPC through prost, whose build script shells
      # out to protoc.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # Guards the esp32-ready constraint: tollgate-core and tollgate-protocol are
  # no_std, so they must build for a target that has no std.
  no_std:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: thumbv7em-none-eabihf
      - name: Build core + protocol for a bare-metal target
        run: cargo build -p tollgate-protocol -p tollgate-core --target thumbv7em-none-eabihf

  # The docker topologies under testing/. The GitHub workflow builds the image
  # once and fans the suites out over a matrix through an uploaded artifact;
  # here one job builds the image and runs every suite against it, so nothing
  # depends on artifact support in the runner. Every suite runs even after one
  # fails, and the job fails if any did.
  #
  # `fips` is left out, as on GitHub: it needs a second image built from a FIPS
  # checkout this repository does not carry (testing/README.md).
  integration:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check docker is available
        run: docker version && docker compose version
      - name: Build tollgate-test image
        run: testing/scripts/build.sh
      - name: Run the suites
        # SKIP_BUILD reuses the image built above instead of rebuilding it.
        run: |
          failed=""
          for suite in peering purchase refusal rollover allowance forwarding; do
            echo "::group::$suite"
            if SKIP_BUILD=1 "testing/$suite/test.sh"; then
              echo "PASS: $suite"
            else
              echo "FAIL: $suite"
              failed="$failed $suite"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi
