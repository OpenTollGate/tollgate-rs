[workspace]
resolver = "2"
members = [
    "crates/tollgate-protocol",
    "crates/tollgate-core",
    "crates/tollgate-net",
]
# `reference/` holds checkouts of other projects, each with its own workspace.
# Without this, cargo treats their crates as members of ours and tries to
# resolve their `workspace = true` inheritance against this manifest.
exclude = ["reference"]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/OpenTollGate/tollgate-rs"
authors = ["TollGate contributors"]

[workspace.lints.rust]
# protocol and core are no_std and have no reason to reach for unsafe.
# tollgate-net only drives I/O; keep the whole tree safe by default.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.dependencies]
# --- internal crates ---
tollgate-protocol = { path = "crates/tollgate-protocol", version = "0.1.0" }
tollgate-core = { path = "crates/tollgate-core", version = "0.1.0" }

# --- no_std, used by protocol and core ---
# minicbor: no_std-first CBOR. The wire format's integer field keys map onto
# the low-level Encoder/Decoder directly, so no derive is needed.
minicbor = { version = "0.24", default-features = false, features = ["alloc"] }

# --- std, used by tollgate-net only ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time", "io-util"] }
# secp256k1 carries its own sha256, so the node needs no separate hash crate
# for signing; `sha2` below is for deriving channel identifiers.
secp256k1 = { version = "0.30", features = ["rand", "global-context"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
