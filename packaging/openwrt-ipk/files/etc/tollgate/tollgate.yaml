# TollGate node configuration.
#
# What is here is enough to run: the node comes up, peers with anything that
# dials it, and gates the router's forwarding path with nftables and tc. What
# it will not do until you fill in the market section is sell anything.
#
# Every setting has a default, so this file only states what a router needs
# different from one. `tollgated --help` and the comments in
# `crates/tollgate-net/src/config.rs` are the full list.

identity:
  # Written on first boot by /etc/uci-defaults/90-tollgate-setup, because a
  # node that generated a new key each start would be a new node each start —
  # its peers would not recognise it and the vouchers they hold would be
  # claims on an issuer that no longer exists.
  secret_key: null

mint:
  # This node's own mint, which peers fund channels against. It is `mintd`,
  # configured in mint.yaml beside this file; this block only says where it
  # is. It has to be reachable *by peers*, so the address a peer sees is the
  # one to put here — by default the router's LAN address.
  url: "http://192.168.1.1:3338"
  # Where tollgated reaches mintd itself, to settle channels funded in this
  # node's vouchers and burn what they paid.
  local: "http://127.0.0.1:3338"
  unit: "byte"

access:
  minimum_flow:
    # A trickle for peers that have paid nothing, which is what lets them
    # reach the mint to buy vouchers in the first place. Small, because it is
    # given away and can be farmed.
    enabled: true
    bytes_per_second: 4096

merchant:
  # merchantd, configured in merchant.yaml beside this file: it prices and
  # sells this router's capacity, holds the money, and supplies the vouchers
  # this node funds its channels with. This node holds none itself.
  socket: "/run/merchantd.sock"

enforcer:
  # The real thing on a router: the kernel forwards, nftables gates, tc shapes.
  kind: ip
  # The interface facing the peers being sold to. `br-lan` on a stock OpenWrt
  # router; change it if you are selling on something else.
  interface: br-lan

network:
  listen: "0.0.0.0:4747"
