# mintd: this node's own mint. Issues the node's byte vouchers and redeems
# them on delivery. No Lightning, and nothing but the standard Cashu API.
# Every change here needs a restart of mintd.

unit: "byte"
# The URL peers reach the mint on. Must match mint.url in tollgate.yaml.
url: "http://127.0.0.1:3338"

# The mint's own secret, created on first start. Losing it retires every
# voucher outstanding, since the keyset cannot be rebuilt.
seed_file: "/usr/local/var/lib/tollgate/mint.seed"
# The record of which vouchers this mint has already redeemed. Without it
# every voucher already paid out redeems again.
file: "/usr/local/var/lib/tollgate/mint.sqlite"

public:
  listen: "127.0.0.1:3338"
# Mint quotes here are paid on creation: whoever reaches it can print this
# node's vouchers. Loopback only, for merchantd.
private:
  listen: "127.0.0.1:3337"

# Give vouchers away to any peer that asks, on the public listener. For
# testing and for handing free vouchers to third parties; a node that sells
# turns it off. Uncapped in value: only requests are rationed.
auto_accept: true
issue_quotes_per_minute: 60
